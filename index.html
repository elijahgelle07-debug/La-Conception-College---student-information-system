<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Information Management System</title>
<style>
  body { font-family: Arial, sans-serif; margin: 15px; background: #f4f4f9; }
  .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  input, button { padding: 8px; margin: 4px 0; border-radius: 4px; border: 1px solid #ccc; }
  button { background: #0056b3; color: white; border: none; font-weight: bold; cursor: pointer; }
  .btn-warn { background: #e0a800; color: black; }
  .btn-del { background: #dc3545; }
  .btn-sec { background: #6c757d; }
  #msg { padding: 10px; margin: 10px 0; border-radius: 4px; display: none; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background: #0056b3; color: white; }
  .log { background: #222; color: #0f0; padding: 8px; font-family: monospace; font-size: 12px; height: 80px; overflow-y: auto; }
</style>
</head>
<body>
<div class="box">
  <h3>Student Information Management System</h3>
  <div id="msg"></div>

  <input type="text" id="sid" placeholder="Student ID (e.g. 20241762)">
  <input type="text" id="sname" placeholder="Full Name">
  <input type="text" id="scourse" placeholder="Course (e.g. BSIS 2A)">
  <input type="number" id="sgwa" step="0.01" placeholder="GWA (1.00 - 5.00)">
  <br>
  <button id="btnAdd">Add Student</button>
  <button id="btnUpdate" class="btn-warn">Update Existing</button>

  <hr>
  <input type="text" id="q" placeholder="Search ID or Name">
  <br>
  <button id="btnHash">Search ID (Hash Table)</button>
  <button id="btnLinear">Search Name (Linear)</button>
  <button id="btnSortName">Sort Name (Bubble)</button>
  <button id="btnSortGwa">Sort GWA (Bubble)</button>
  <button id="btnShowAll">Show All</button>
  <button id="btnReset" class="btn-sec">Reset Default Data</button>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Course</th><th>GWA</th><th>Action</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <h4>Activity History (Stack - LIFO)</h4>
  <button id="btnUndo">Undo Last Delete (Pop)</button>
  <div class="log" id="log"></div>
</div>

<script>
// @ts-nocheck
let arr = [];
let map = new Map();
let delStack = [];
let logStack = [];

function saveData() {
  localStorage.setItem("sims_records_v3", JSON.stringify(arr));
  localStorage.setItem("sims_logs_v3", JSON.stringify(logStack));
}

function notify(text, isErr) {
  const m = document.getElementById("msg");
  if (!m) return;
  m.style.display = "block";
  m.style.background = isErr ? "#f8d7da" : "#d4edda";
  m.style.color = isErr ? "#721c24" : "#155724";
  m.innerText = text;
}

function addLog(txt) {
  logStack.push(txt);
  const logEl = document.getElementById("log");
  if (logEl) logEl.innerHTML = logStack.slice().reverse().join("<br>");
  saveData();
}

function showAll(list = arr) {
  const tb = document.getElementById("tbody");
  if (!tb) return;
  tb.innerHTML = "";
  for (let i = 0; i < list.length; i++) {
    const s = list[i];
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.id}</td><td>${s.name}</td><td>${s.course}</td><td>${s.gwa.toFixed(2)}</td>
      <td>
        <button class="edit-btn">Edit</button>
        <button class="btn-del del-btn">Del</button>
      </td>
    `;
    tr.querySelector(".edit-btn").addEventListener("click", () => editForm(s.id));
    tr.querySelector(".del-btn").addEventListener("click", () => delRec(s.id));
    tb.appendChild(tr);
  }
}

function addRec() {
  const id = document.getElementById("sid").value.trim();
  const name = document.getElementById("sname").value.trim();
  const course = document.getElementById("scourse").value.trim();
  const gwa = parseFloat(document.getElementById("sgwa").value);

  if (!id || !name || !course || isNaN(gwa)) return notify("Error: Fill all fields!", true);
  if (gwa < 1.0 || gwa > 5.0) return notify("Error: GWA must be 1.00 to 5.00!", true);
  if (map.has(id)) return notify("Error: Duplicate Student ID!", true);

  const obj = { id, name, course, gwa };
  arr.push(obj);
  map.set(id, obj);
  addLog("[ADD] " + id + " - " + name);
  notify("Added & Saved: " + name, false);
  clearF();
  showAll();
}

function updateRec() {
  const id = document.getElementById("sid").value.trim();
  const name = document.getElementById("sname").value.trim();
  const course = document.getElementById("scourse").value.trim();
  const gwa = parseFloat(document.getElementById("sgwa").value);

  const obj = map.get(id);
  if (!obj) return notify("Error: ID not found!", true);
  if (!name || !course || isNaN(gwa) || gwa < 1.0 || gwa > 5.0) return notify("Error: Invalid inputs!", true);

  obj.name = name;
  obj.course = course;
  obj.gwa = gwa;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i].id === id) arr[i] = obj;
  }
  addLog("[UPDATE] " + id + " - " + name);
  notify("Updated & Saved: " + name, false);
  clearF();
  showAll();
}

function delRec(id) {
  const s = map.get(id);
  if (!s) return;
  delStack.push(s);
  map.delete(id);
  arr = arr.filter(x => x.id !== id);
  addLog("[DELETE] " + id + " - " + s.name);
  notify("Deleted ID: " + id + " (Click Undo to restore)", true);
  showAll();
}

function undoDel() {
  const s = delStack.pop();
  if (!s) return notify("Error: Stack is empty!", true);
  arr.push(s);
  map.set(s.id, s);
  addLog("[RESTORE] " + s.id + " - " + s.name);
  notify("Restored & Saved: " + s.name, false);
  showAll();
}

function hashSearch() {
  const q = document.getElementById("q").value.trim();
  if (!q) return notify("Enter ID to search!", true);
  const found = map.get(q);
  if (found) {
    showAll([found]);
    addLog("[HASH SEARCH] Found " + q);
    notify("Found ID: " + q, false);
  } else {
    notify("Record not found!", true);
  }
}

function linearSearch() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (!q) return notify("Enter Name to search!", true);
  const res = [];
  for (let i = 0; i < arr.length; i++) {
    if (arr[i].name.toLowerCase().includes(q)) res.push(arr[i]);
  }
  if (res.length > 0) {
    showAll(res);
    addLog("[LINEAR SEARCH] Matched: " + res.length);
    notify("Found " + res.length + " record(s)", false);
  } else {
    notify("No matching name found!", true);
  }
}

function sortName() {
  for (let i = 0; i < arr.length - 1; i++) {
    for (let j = 0; j < arr.length - i - 1; j++) {
      if (arr[j].name.toLowerCase() > arr[j + 1].name.toLowerCase()) {
        const t = arr[j];
        arr[j] = arr[j + 1];
        arr[j + 1] = t;
      }
    }
  }
  addLog("[BUBBLE SORT] Sorted by Name");
  notify("Sorted by Name (A-Z)", false);
  showAll();
}

function sortGwa() {
  for (let i = 0; i < arr.length - 1; i++) {
    for (let j = 0; j < arr.length - i - 1; j++) {
      if (arr[j].gwa > arr[j + 1].gwa) {
        const t = arr[j];
        arr[j] = arr[j + 1];
        arr[j + 1] = t;
      }
    }
  }
  addLog("[BUBBLE SORT] Sorted by GWA");
  notify("Sorted by GWA (Highest First)", false);
  showAll();
}

function editForm(id) {
  const s = map.get(id);
  if (!s) return;
  document.getElementById("sid").value = s.id;
  document.getElementById("sname").value = s.name;
  document.getElementById("scourse").value = s.course;
  document.getElementById("sgwa").value = String(s.gwa);
  notify("Editing ID: " + id, false);
}

function clearF() {
  document.getElementById("sid").value = "";
  document.getElementById("sname").value = "";
  document.getElementById("scourse").value = "";
  document.getElementById("sgwa").value = "";
}

function resetStorage() {
  localStorage.removeItem("sims_records_v3");
  localStorage.removeItem("sims_logs_v3");
  location.reload();
}

document.getElementById("btnAdd").addEventListener("click", addRec);
document.getElementById("btnUpdate").addEventListener("click", updateRec);
document.getElementById("btnHash").addEventListener("click", hashSearch);
document.getElementById("btnLinear").addEventListener("click", linearSearch);
document.getElementById("btnSortName").addEventListener("click", sortName);
document.getElementById("btnSortGwa").addEventListener("click", sortGwa);
document.getElementById("btnShowAll").addEventListener("click", () => showAll());
document.getElementById("btnReset").addEventListener("click", resetStorage);
document.getElementById("btnUndo").addEventListener("click", undoDel);

const savedRecords = localStorage.getItem("sims_records_v3");
const savedLogs = localStorage.getItem("sims_logs_v3");

if (savedRecords) {
  arr = JSON.parse(savedRecords);
  arr.forEach(s => map.set(s.id, s));
  logStack = savedLogs ? JSON.parse(savedLogs) : [];
  document.getElementById("log").innerHTML = logStack.slice().reverse().join("<br>");
} else {
  const init = [
    { id: "20241762", name: "Elijah Gabriel P. Gelle", course: "BSIS 2A", gwa: 1.25 },
    { id: "20241801", name: "Christian Gelle", course: "BSIS 2A", gwa: 1.50 },
    { id: "20241802", name: "Adelfa Irene P. Gelle", course: "BSIS 2A", gwa: 1.25 }
  ];
  init.forEach(s => { arr.push(s); map.set(s.id, s); });
  addLog("[SYSTEM] Loaded 3 initial records");
}
showAll();
</script>
</body>
</html>
